[package]
name = "lenslate"
version = "0.1.0"
description = "A desktop screen translator"
authors = ["LensLate contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lenslate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
xcap = "0.9"
dirs = "5.0"
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
base64 = "0.22"
png = "0.18"
chrono = { version = "0.4", features = ["serde"] }

# OCR (Phase 3a)
ort = { version = "2.0.0-rc.13", default-features = false, features = [
    "std",
    "ndarray",
    "download-binaries",
    "tls-rustls",
] }
ndarray = "0.17"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "rustls-tls",
    "charset",
    "http2",
    "json",
] }

# Translation (Phase 4)
async-trait = "0.1"
lru = "0.12"
urlencoding = "2"
sys-locale = "0.3"
keyring = { version = "3.6", features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# Wayland capture (xdg-desktop-portal + PipeWire) exists only on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", features = ["screencast"] }
pipewire = { version = "0.9", features = ["v0_3_77"] }

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[[example]]
name = "ocr_file"
path = "examples/ocr_file.rs"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
